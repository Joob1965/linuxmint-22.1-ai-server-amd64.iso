d-i debian-installer/locale string de_DE
d-i debian-installer/language string de
d-i debian-installer/country string DE
d-i keyboard-configuration/xkb-keymap select de
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string ai-server
d-i netcfg/get_domain string local
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Joachim
d-i passwd/username string joachim
d-i passwd/user-password password admin
d-i passwd/user-password-again password admin
d-i passwd/auto-login boolean true
d-i passwd/auto-login-user string joachim
tasksel tasksel/first multiselect standard
d-i pkgsel/include string openssh-server build-essential python3-pip curl wget git htop net-tools
d-i pkgsel/update-policy select none
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda
d-i finish-install/reboot_in_seconds integer 10
